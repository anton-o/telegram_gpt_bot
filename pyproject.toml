[project]
name = "telegram-gpt-bot"
version = "0.1.0"
description = "Telegram bot backed by OpenAI and Google Gemini"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai==2.3.0",
    "openai==1.86",
    "python-telegram-bot==22.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.1.0",
    "pytest-cov==6.2.1",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "backend_handlers",
    "bot_secrets",
    "help",
    "main",
    "state_store",
    "utils_handlers",
    "white_lists",
]
